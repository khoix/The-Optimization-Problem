<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e16" />
    <title>The Optimization Problem</title>
    <!--
      One artwork, three sizes, each drawn at its own resolution rather than
      scaled down from the largest — see tools/icon.mjs. The Apple icon is a
      real PNG at a real URL because that is the only thing iOS accepts for the
      slot: it ignores SVG there, and it ignores data: URIs.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <!--
      The boot screen's own stylesheet, inlined here by a plugin in
      vite.config.ts. It is the one screen that has to be styled by the same
      response that delivers it: everything else can wait for a <link>, but a
      screen whose whole job is to be on paint immediately cannot.
    -->
    <!--boot-css-->
  </head>
  <body class="booting">
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <!--
      The boot screen is markup rather than something the script builds, and it
      is above `#app` in the document so it is on screen before a single module
      has been parsed. Everything the loading bar is counting happens after
      this paints; building the screen that says "loading" out of the thing
      being loaded is the one arrangement guaranteed to show the player a blank
      page for exactly as long as the wait lasts.

      The title is real text with a real label. `boot.ts` splits the words into
      per-letter spans to animate them, and marks the result hidden from
      assistive technology — the accessible name comes from the heading.
    -->
    <div id="boot" class="boot">
      <canvas id="boot-city" class="boot-city" aria-hidden="true"></canvas>
      <div class="boot-veil" aria-hidden="true"></div>
      <div class="boot-stage">
        <h1 class="boot-title" aria-label="The Optimization Problem">
          <span class="boot-line boot-sm" data-split>THE</span>
          <span class="boot-line boot-lg" data-split>OPTIMIZATION</span>
          <span class="boot-line boot-lg" data-split>PROBLEM</span>
          <span class="boot-scan" aria-hidden="true"></span>
        </h1>
        <p class="boot-rule" aria-hidden="true"></p>
      </div>
      <!-- Outside `.boot-stage` on purpose: the stage is centred on the screen
           and carries the title, and the loader is positioned against the
           screen itself. Left inside, its `bottom` would resolve against the
           stage — which is only as tall as the words in it — and put the
           loading bar across the middle of the title. -->
      <div class="boot-foot">
        <div class="boot-bar" role="progressbar" aria-label="Loading"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="boot-bar">
          <i id="boot-fill"></i>
        </div>
        <p class="boot-status"><span id="boot-step">Starting up</span><span id="boot-pct">0%</span></p>
        <button id="boot-begin" class="boot-begin" hidden>Tap to Begin</button>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
